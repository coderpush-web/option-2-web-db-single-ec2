AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 2 - Single Web EC2 running React App & SQLite DB with CloudFront Edge Caching'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  InstanceType:
    Type: String
    Default: t3.micro

  VolumeSize:
    Type: Number
    Default: 20

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ImageTag:
    Type: String
    Default: latest

  DomainName:
    Type: String
    Default: png261.dev

  SubdomainName:
    Type: String
    Default: opt2-dev.png261.dev

Resources:
  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-StandaloneWebSecurityGroupId'
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf update -y
          dnf install -y docker aws-cli
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user

          mkdir -p /var/data/sqlite

          AWS_REGION="${AWS::Region}"
          ACCOUNT_ID="${AWS::AccountId}"
          IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-2-web-app:${ImageTag}"

          echo "Logging into Amazon ECR..."
          aws ecr get-login-password --region "${AWS::Region}" | docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" || true

          echo "Pulling Docker image: $IMAGE_URI"
          docker pull "$IMAGE_URI" || true

          cat << 'SVC' > /etc/systemd/system/react-webapp.service
          [Unit]
          Description=Dockerized React Web App with SQLite
          After=docker.service
          Requires=docker.service

          [Service]
          TimeoutStartSec=0
          Restart=always
          ExecStartPre=-/usr/bin/docker stop react-webapp
          ExecStartPre=-/usr/bin/docker rm react-webapp
          ExecStart=/usr/bin/docker run --name react-webapp -p 80:80 \
            --log-driver=awslogs \
            --log-opt awslogs-region=${AWS::Region} \
            --log-opt awslogs-group=/aws/ec2/${EnvironmentName}-option-2-webapp \
            --log-opt awslogs-create-group=true \
            -v /var/data/sqlite:/app/data \
            -e APP_ENV=${EnvironmentName} -e PORT=80 \
            ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-2-web-app:${ImageTag}
          ExecStop=/usr/bin/docker stop react-webapp

          [Install]
          WantedBy=multi-user.target
          SVC

          systemctl daemon-reload
          systemctl enable react-webapp
          systemctl start react-webapp || true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-sqlite-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WebServerInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-sqlite-eip'
        - Key: Environment
          Value: !Ref EnvironmentName

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${EnvironmentName} Option 2 Web Distribution'
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: EC2Origin
            DomainName: !GetAtt WebServerInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: EC2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c1d-47e7-81dd-c14a2a485ea9
          Compress: true
        CacheBehaviors:
          - PathPattern: '/_next/static/*'
            TargetOriginId: EC2Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
          - PathPattern: '/static/*'
            TargetOriginId: EC2Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt2-cf'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  WebsiteURL:
    Description: Website URL via CloudFront CDN
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
  PublicIP:
    Description: Elastic IP
    Value: !Ref WebServerEIP
  PublicDNS:
    Description: EC2 Public DNS Name
    Value: !GetAtt WebServerInstance.PublicDnsName
  CustomDomainURL:
    Description: Custom Domain Website URL (png261.dev)
    Value: !Sub 'https://${SubdomainName}'
  RootDomain:
    Description: Root Domain Name
    Value: !Ref DomainName
  DnsRecordType:
    Description: DNS Record Type for Cloudflare / Route 53
    Value: 'CNAME'
  DnsRecordName:
    Description: DNS Record Name
    Value: !Ref SubdomainName
  DnsRecordValue:
    Description: DNS Record Value (CloudFront Distribution Target)
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudflareProxyGuide:
    Description: Cloudflare Setup Instructions
    Value: !Sub 'Add CNAME in Cloudflare: ${SubdomainName} -> ${CloudFrontDistribution.DomainName} (or A record to ${WebServerEIP.PublicIp}) with SSL/TLS Full.'
