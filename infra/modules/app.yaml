AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 2 - Single Web EC2 running React App & SQLite DB in Private Subnet behind ALB with CloudFront Edge Caching'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  InstanceType:
    Type: String
    Default: t3.micro

  VolumeSize:
    Type: Number
    Default: 20

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ImageTag:
    Type: String
    Default: latest

  SubdomainName:
    Type: String
    Default: opt2-dev.png261.dev

  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email address to receive CloudWatch Alarms SNS notifications

  CertificateArn:
    Type: String
    Default: ''
    Description: ACM Certificate ARN for HTTPS ALB listener (*.png261.dev)

Conditions:
  IsProd: !Equals [!Ref EnvironmentName, 'prod']
  HasCertificateArn: !Not [!Equals [!Ref CertificateArn, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  OpsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${EnvironmentName}-opt2-ops-alerts'
      DisplayName: !Sub '${EnvironmentName} Option 2 Ops Alerts'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt2-ops-alert-topic'
        - Key: Environment
          Value: !Ref EnvironmentName

  OpsAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref OpsAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/ec2/${EnvironmentName}-option-2-webapp'
      RetentionInDays: !If [IsProd, 30, 14]
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt2-log-group'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}-opt2-web-auth-secret'
      Description: !Sub 'NextAuth session encryption key for ${EnvironmentName} web app'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: 'auth_secret'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt2-web-auth-secret'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf install -y docker aws-cli
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user

          mkdir -p /var/data/sqlite
          chown -R 1001:1001 /var/data/sqlite
          chmod 700 /var/data/sqlite

          AWS_REGION="${AWS::Region}"
          ACCOUNT_ID="${AWS::AccountId}"
          IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-2-web-app:${ImageTag}"

          echo "Logging into Amazon ECR..."
          for i in {1..5}; do
            aws ecr get-login-password --region "${AWS::Region}" | docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" && break || sleep 5
          done

          echo "Pulling Docker image: $IMAGE_URI"
          for i in {1..5}; do
            docker pull "$IMAGE_URI" && break || sleep 5
          done

          echo "Fetching application secrets from AWS Secrets Manager..."
          SECRET_VAL=$(aws secretsmanager get-secret-value \
            --secret-id "${EnvironmentName}-opt2-web-auth-secret" \
            --region "${AWS::Region}" \
            --query SecretString \
            --output text 2>/dev/null || true)
          AUTH_SECRET=$(echo "$SECRET_VAL" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('auth_secret', ''))" 2>/dev/null || echo "$SECRET_VAL")

          mkdir -p /etc
          echo "APP_ENV=${EnvironmentName}" > /etc/react-webapp.env
          echo "PORT=80" >> /etc/react-webapp.env
          echo "AUTH_SECRET=$AUTH_SECRET" >> /etc/react-webapp.env
          echo "AUTH_URL=http://localhost:3000" >> /etc/react-webapp.env
          echo "SQLITE_DB_PATH=/app/data/app.db" >> /etc/react-webapp.env
          chmod 600 /etc/react-webapp.env

          cat << 'SVC' > /etc/systemd/system/react-webapp.service
          [Unit]
          Description=Dockerized React Web App with SQLite
          After=docker.service
          Requires=docker.service

          [Service]
          TimeoutStartSec=0
          Restart=always
          ExecStartPre=-/usr/bin/docker stop react-webapp
          ExecStartPre=-/usr/bin/docker rm react-webapp
          ExecStart=/usr/bin/docker run --name react-webapp -p 80:80 \
            --env-file /etc/react-webapp.env \
            --log-driver=awslogs \
            --log-opt awslogs-region=${AWS::Region} \
            --log-opt awslogs-group=/aws/ec2/${EnvironmentName}-option-2-webapp \
            --log-opt awslogs-create-group=true \
            -v /var/data/sqlite:/app/data \
            ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-2-web-app:${ImageTag}
          ExecStop=/usr/bin/docker stop react-webapp

          [Install]
          WantedBy=multi-user.target
          SVC

          systemctl daemon-reload
          systemctl enable react-webapp
          systemctl start react-webapp || true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-sqlite-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-opt2-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet2Id'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-ALBSecurityGroupId'
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt2-alb'
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-opt2-tg'
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: instance
      Targets:
        - Id: !Ref WebServerInstance
          Port: 80
      HealthCheckPath: /api/health
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt2-tg'
        - Key: Environment
          Value: !Ref EnvironmentName

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        !If
          - HasCertificateArn
          - - Type: redirect
              RedirectConfig:
                Protocol: HTTPS
                Port: '443'
                StatusCode: HTTP_301
          - - Type: fixed-response
              FixedResponseConfig:
                StatusCode: '403'
                ContentType: 'text/plain'
                MessageBody: 'Direct access to ALB is forbidden. Please access via CloudFront distribution.'

  ALBHeaderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: 'X-CloudFront-Origin-Verify'
            Values:
              - !Sub '${EnvironmentName}-secure-origin-${AWS::AccountId}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  ALBHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificateArn
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: 'text/plain'
            MessageBody: 'Direct access to ALB is forbidden. Please access via CloudFront distribution.'

  ALBHttpsHeaderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificateArn
    Properties:
      ListenerArn: !Ref ALBHttpsListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: 'X-CloudFront-Origin-Verify'
            Values:
              - !Sub '${EnvironmentName}-secure-origin-${AWS::AccountId}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${EnvironmentName} Option 2 Web Distribution'
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: 'X-CloudFront-Origin-Verify'
                HeaderValue: !Sub '${EnvironmentName}-secure-origin-${AWS::AccountId}'
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
        CacheBehaviors:
          - PathPattern: '/_next/static/*'
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
          - PathPattern: '/static/*'
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-opt2-cf'
        - Key: Environment
          Value: !Ref EnvironmentName

  ALB5xxErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: 'Alarm if ALB 5XX error count exceeds 10 in 1 minute'
      MetricName: HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref OpsAlertTopic
      OKActions:
        - !Ref OpsAlertTopic
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ALBTargetGroup.TargetGroupFullName

  WebInstanceHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: 'Alarm if EC2 CPU utilization exceeds 85% for 2 consecutive periods'
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref OpsAlertTopic
      OKActions:
        - !Ref OpsAlertTopic
      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServerInstance

Outputs:
  WebsiteURL:
    Description: Website URL via CloudFront CDN
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
  LoadBalancerDNS:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ECRRepositoryUri:
    Description: ECR Repository URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-2-web-app'
  PrivateIP:
    Description: EC2 Private IP
    Value: !GetAtt WebServerInstance.PrivateIp
  CustomDomainURL:
    Description: Custom Domain Website URL
    Value: !Sub 'https://${SubdomainName}'
  DnsRecordType:
    Description: DNS Record Type
    Value: 'CNAME'
  DnsRecordName:
    Description: DNS Record Name
    Value: !Ref SubdomainName
  DnsRecordValue:
    Description: DNS Record Value (CloudFront Distribution Target)
    Value: !GetAtt CloudFrontDistribution.DomainName
  DNSSetupGuide:
    Description: Custom Domain DNS Setup Instructions
    Value: !Sub 'Add CNAME in DNS: ${SubdomainName} -> ${CloudFrontDistribution.DomainName} (DNS-only / no proxy).'
  OpsAlertTopicArn:
    Description: Ops Monitoring Alert SNS Topic ARN
    Value: !Ref OpsAlertTopic
